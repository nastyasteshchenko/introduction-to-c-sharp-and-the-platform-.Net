version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hackathon_net

  db:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d hackathon-problem -U postgres || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hackathon_net
  
  hr-manager:
    build:
      context: .
      dockerfile: ./HrManager/Dockerfile
    deploy:
      replicas: 1
    environment:
      PREFS_AMOUNT: ${PREFS_AMOUNT}
    ports:
      - "${HR_MANAGER_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      hr-director:
        condition: service_started
    networks:
      - hackathon_net

  hr-director:
    build:
      context: .
      dockerfile: ./HrDirector/Dockerfile
    deploy:
      replicas: 1
    environment:
      CONNECTION_STRING: "Host=db;Port=5432;Database=hackathon-problem;Username=postgres;Password=postgres"
    ports:
      - "${HR_DIRECTOR_PORT}:8080"
    networks:
      - hackathon_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy

  developer-base: &developer-base
    build:
      context: .
      dockerfile: ./Developer/Dockerfile
    deploy:
      replicas: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
#      hr-manager:
#        condition: service_started
    networks:
      - hackathon_net
  
  teamlead-1:
    <<: *developer-base
    environment:
      TYPE: teamlead
      ID: 6
    ports:
      - "${TEAMLEAD_1_PORT}:8080"

  teamlead-2:
    <<: *developer-base
    environment:
      TYPE: teamlead
      ID: 7
    ports:
      - "${TEAMLEAD_2_PORT}:8080"

  teamlead-3:
    <<: *developer-base
    environment:
      TYPE: teamlead
      ID: 8
    ports:
      - "${TEAMLEAD_3_PORT}:8080"
  
  teamlead-4:
    <<: *developer-base
    environment:
      TYPE: teamlead
      ID: 9
    ports:
      - "${TEAMLEAD_4_PORT}:8080"
  
  teamlead-5:
    <<: *developer-base
    environment:
      TYPE: teamlead
      ID: 10
    ports:
      - "${TEAMLEAD_5_PORT}:8080"
  
  junior-1:
    <<: *developer-base
    environment:
      TYPE: junior
      ID: 1
    ports:
      - "${JUNIOR_1_PORT}:8080"
  
  junior-2:
    <<: *developer-base
    environment:
      TYPE: junior
      ID: 2
    ports:
      - "${JUNIOR_2_PORT}:8080"
  
  junior-3:
    <<: *developer-base
    environment:
      TYPE: junior
      ID: 3
    ports:
      - "${JUNIOR_3_PORT}:8080"

  junior-4:
    <<: *developer-base
    environment:
      TYPE: junior
      ID: 4
    ports:
      - "${JUNIOR_4_PORT}:8080"
  
  junior-5:
    <<: *developer-base
    environment:
      TYPE: junior
      ID: 5
    ports:
      - "${JUNIOR_5_PORT}:8080"

networks:
  hackathon_net:
    driver: bridge
