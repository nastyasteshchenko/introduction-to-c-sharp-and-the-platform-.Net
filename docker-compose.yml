version: '3.8'

services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d hackathon-problem -U postgres || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hackathon_net
  
  hr-manager:
    build:
      context: .
      dockerfile: ./HrManager/Dockerfile
    deploy:
      replicas: 1
    environment:
      PREFS_AMOUNT: ${PREFS_AMOUNT}
    ports:
      - "${HR_MANAGER_PORT}:8080"
    networks:
      - hackathon_net

  hr-director:
    build:
      context: .
      dockerfile: ./HrDirector/Dockerfile
    deploy:
      replicas: 1
    environment:
      CONNECTION_STRING: "Host=db;Port=5432;Database=hackathon-problem;Username=postgres;Password=postgres"
    ports:
      - "${HR_DIRECTOR_PORT}:8080"
    networks:
      - hackathon_net
    depends_on:
      - db

  teamlead-1:
    image: developer:latest
    build:
      context: .
      dockerfile: ./Developer/Dockerfile
    deploy:
      replicas: 1
    environment:
      TYPE: teamlead
      ID: 6
    ports:
      - "${TEAMLEAD_1_PORT}:8080"
    depends_on:
      - hr-director
      - hr-manager
    networks:
      - hackathon_net

  teamlead-2:
